[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md2pdf"
version = "0.1.0"
description = "Convert Markdown files to PDF with syntax-highlighted code blocks and styled tables."
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3",
    "mdit-py-plugins>=0.4",
    "pygments>=2.17",
    "weasyprint>=61",
]

[project.scripts]
md2pdf = "md_to_pdf.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/md_to_pdf"]

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
